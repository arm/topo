name: Generate source SBOM
description: Generate a CycloneDX source SBOM and add the external remoteproc runtime.
inputs:
  release-tag:
    description: Release version recorded in the SBOM.
    required: true
runs:
  using: composite
  steps:
    - name: Generate CycloneDX source SBOM
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.release-tag }}
        CDXGEN_IMAGE: ghcr.io/cdxgen/cdxgen@sha256:c1c933ce31df8b3978566b4dc8369ce3ac049a802aa90cb8f02a29be4820c798
        SBOM_DISCLAIMER: 'THIS SOFTWARE BILL OF MATERIALS ("SBOM") IS PROVIDED BY ARM LIMITED "AS IS" AND ANY EXPRESS OR IMPLIED WARRANTIES, INCLUDING, BUT NOT LIMITED TO, THE IMPLIED WARRANTIES OF MERCHANTABILITY, FITNESS FOR A PARTICULAR PURPOSE, AND NONINFRINGEMENT ARE DISCLAIMED. IN NO EVENT SHALL ARM LIMITED BE LIABLE FOR ANY DIRECT, INDIRECT, INCIDENTAL, SPECIAL, EXEMPLARY, OR CONSEQUENTIAL DAMAGES (INCLUDING, BUT NOT LIMITED TO, PROCUREMENT OF SUBSTITUTE GOODS OR SERVICES; LOSS OF USE, DATA, OR PROFITS; OR BUSINESS INTERRUPTION) HOWEVER CAUSED AND ON ANY THEORY OF LIABILITY, WHETHER IN CONTRACT, STRICT LIABILITY, OR TORT (INCLUDING NEGLIGENCE OR OTHERWISE) ARISING IN ANY WAY OUT OF THE USE OF THIS SBOM, EVEN IF ADVISED OF THE POSSIBILITY OF SUCH DAMAGE.'
      run: |
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          -e FETCH_LICENSE=true -e HOME=/tmp \
          -v "$GITHUB_WORKSPACE:/app" \
          "$CDXGEN_IMAGE" \
          --type go --fail-on-error \
          --project-name topo --project-version "$RELEASE_TAG" \
          --metadata-property "arm:sbom-disclaimer=$SBOM_DISCLAIMER" \
          /app -o /app/topo-sbom-source.json
        cd "$GITHUB_WORKSPACE"
        test -s topo-sbom-source.json

    - name: Add external remoteproc-runtime dependency to SBOM
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        cd "$GITHUB_WORKSPACE"
        jq -f "$ACTION_PATH/add-remoteproc-runtime.jq" topo-sbom-source.json > topo-sbom-source.json.tmp
        mv topo-sbom-source.json.tmp topo-sbom-source.json
